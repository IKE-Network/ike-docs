# Dedicated fixture for referencedComponentExample/PatternField.example parsing
# (IKE-Network/ike-issues#883) and PatternField.default parsing (IKE-Network/ike-issues#888)
# -- deliberately separate from pattern-shape-test.yml, which
# KonceptPatternListBlockMacroTest also loads and asserts an exact pattern count/order against.

PatternWithExample:
  label: Pattern With Example
  kind: pattern
  referencedComponentMeaning: ExampleTestMeaning
  referencedComponentPurpose: ExampleTestPurpose
  referencedComponentExample: ExampleTestMeaning
  fields:
    - meaning: ExampleFieldOneMeaning
      purpose: ExampleFieldOnePurpose
      dataType: ExampleFieldOneType
      example: ExampleFieldOneMeaning
      default: ExampleFieldOneDefault
    - meaning: ExampleFieldTwoMeaning
      purpose: ExampleFieldTwoPurpose
      dataType: ExampleFieldTwoType
      example: "a literal example value"
      default: "a literal default value"

ExampleTestMeaning:
  label: Example Test Meaning
ExampleTestPurpose:
  label: Example Test Purpose
ExampleFieldOneMeaning:
  label: Example Field One Meaning
ExampleFieldOneDefault:
  label: Example Field One Default
ExampleFieldOnePurpose:
  label: Example Field One Purpose
ExampleFieldOneType:
  label: Example Field One Type
ExampleFieldTwoMeaning:
  label: Example Field Two Meaning
ExampleFieldTwoPurpose:
  label: Example Field Two Purpose
ExampleFieldTwoType:
  label: Example Field Two Type
